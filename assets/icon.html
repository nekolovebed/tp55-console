<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    width: 256px;
    height: 256px;
    background: transparent;
    overflow: hidden;
  }
  svg { display: block; }
</style>
</head>
<body>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.5" stop-color="#b18cff"/>
      <stop offset="1" stop-color="#f3c580"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#7c5cff" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#soft)">
    <rect x="14" y="14" width="228" height="228" rx="58" fill="url(#g)"/>
    <rect x="14" y="14" width="228" height="228" rx="58" fill="url(#shine)"/>
  </g>

  <!-- EQ curve -->
  <path d="M52 158 C 76 158, 82 108, 104 108 C 126 108, 128 176, 150 176 C 172 176, 172 122, 194 122 C 206 122, 210 138, 212 146"
        fill="none" stroke="#1a1226" stroke-width="11" stroke-linecap="round" opacity="0.92"/>
  <path d="M52 158 C 76 158, 82 108, 104 108 C 126 108, 128 176, 150 176 C 172 176, 172 122, 194 122 C 206 122, 210 138, 212 146"
        fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" opacity="0.55"/>

  <circle cx="104" cy="108" r="9" fill="#1a1226"/>
  <circle cx="104" cy="108" r="4.2" fill="#ffe9c9"/>
  <circle cx="150" cy="176" r="9" fill="#1a1226"/>
  <circle cx="150" cy="176" r="4.2" fill="#ffe9c9"/>
</svg>
</body>
</html>
